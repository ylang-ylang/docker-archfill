name: Scheduled Follow Releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover builds
        id: discover
        run: |
          matrix="$(scripts/recipe-discover-follow-releases.sh)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/build-recipe.yml
    with:
      recipe: ${{ matrix.recipe }}
      version: ${{ matrix.version }}
    secrets: inherit
